<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Mind map — 6. О клинике</title>
  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f4f6fb; color:#1f2937; }
    .top { padding:16px 20px; background:#fff; border-bottom:1px solid #dbe3ef; position:sticky; top:0; z-index:2; }
    h1 { margin:0 0 8px; font-size:22px; }
    .meta { font-size:14px; color:#475569; }
    .canvas { padding:12px; overflow:auto; height:calc(100vh - 92px); }
    .board { background:#fff; border:1px solid #dbe3ef; border-radius:12px; box-shadow:0 6px 20px rgba(15,23,42,.06); display:inline-block; }
    .board img { display:block; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Mind map — 6. О клинике</h1>
    <div class="meta">Зеленым отмечены категории с посадочными страницами. Уникальных путей: 15, узлов: 15.</div>
  </div>
  <div class="canvas"><div class="board"><img src="o-klinike.svg" alt="Mind map — 6. О клинике"></div></div>
</body>
</html>
